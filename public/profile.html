<!DOCTYPE html>
<html lang="ja" data-lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSShowdown - 騎手プロフィール</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 80px 24px 24px; background: #14161a; color: #e8e8e8; }
  h1 { font-size: 20px; }
  .lang-toggle { position: static; background: #33ff66; color: #14161a; border: none; border-radius: 4px; padding: 0.25rem 0.55rem; font-size: 0.75rem; cursor: pointer; }
  #panel { border: 1px solid #333; border-radius: 8px; padding: 16px; margin-top: 16px; max-width: 480px; }
  .row { margin: 10px 0; }
  .label { color: #9aa4b2; display: inline-block; min-width: 6em; }
  a { color: #7ab0ff; }
  .jockey-icon { width: 88px; height: 88px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 40px; }
  #header-row { display: flex; align-items: center; gap: 16px; }
  #profile-edit-panel { border: 1px solid #333; border-radius: 8px; padding: 16px; margin-top: 16px; max-width: 480px; }
  .icon-choices { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .icon-choice { padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #22262d; color: #e8e8e8; cursor: pointer; }
  .icon-choice.selected { outline: 2px solid #3a6ea5; }
  input[type="text"] { font-size: 15px; padding: 8px 10px; border-radius: 6px; border: 1px solid #444; background: #0d0f12; color: #e8e8e8; min-width: 240px; }
  button { font-size: 16px; padding: 10px 18px; margin: 6px 6px 6px 0; border: 0; border-radius: 6px; background: #3a6ea5; color: #fff; cursor: pointer; }

  /* ===== FSSH COMMON MENU ===== */
  .fssh-header { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 1000; background: #0a0e0a; border-bottom: 1px solid #1a8a3a; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .fssh-header-logo { height: 32px; width: auto; }
  .fssh-menu-btn { position: static; width: 40px; height: 40px; background: #0a0e0a; border: 1px solid #33ff66; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; }
  .fssh-menu-btn span { display: block; width: 20px; height: 2px; background: #33ff66; }
  .fssh-overlay { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1001; display: none; }
  .fssh-overlay.open { display: block; }
  .fssh-drawer { position: fixed; top: 56px; left: 0; right: 0; width: auto; max-height: 0; background: #0a0e0a; border-bottom: 1px solid #1a8a3a; z-index: 1002; transition: max-height 0.25s ease; font-family: system-ui, sans-serif; overflow-y: auto; }
  .fssh-drawer.open { max-height: 600px; }
  .fssh-drawer-header { padding: 16px; color: #33ff66; font-weight: 700; border-bottom: 1px solid #1a8a3a; }
  .fssh-drawer nav { padding: 8px 0; }
  .fssh-drawer a { display: block; padding: 12px 16px; color: #d8ffe0; text-decoration: none; font-size: 0.9rem; border-bottom: 1px solid rgba(26,138,58,0.3); }
  .fssh-drawer a:hover { background: rgba(51,255,102,0.1); color: #33ff66; }
  .fssh-drawer .fssh-sub-label { padding: 12px 16px 4px; color: #7fa88f; font-size: 0.78rem; }
  .fssh-drawer .fssh-sub a { padding-left: 32px; font-size: 0.82rem; }
  .fssh-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: #33ff66; font-size: 1.2rem; cursor: pointer; }
  .fssh-header-right { display: flex; align-items: center; gap: 8px; }
  .fssh-discord-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #0a0e0a; border: 1px solid #33ff66; border-radius: 6px; text-decoration: none; font-size: 1rem; }
</style>
</head>
<body>
<div class="fssh-header">
  <button class="fssh-menu-btn" id="fssh-menu-toggle" aria-label="メニュー"><span></span><span></span><span></span></button>
  <img src="images/fssh_logo.png" alt="FSShowdown" class="fssh-header-logo">
  <div class="fssh-header-right">
    <a href="https://discord.gg/KjuzxrRZGx" target="_blank" rel="noopener" class="fssh-discord-btn" aria-label="Discord">💬</a>
    <button class="lang-toggle" id="lang-toggle" aria-label="言語切り替え">ENG</button>
  </div>
</div>
<div class="fssh-overlay" id="fssh-overlay"></div>
<div class="fssh-drawer" id="fssh-drawer">
  <button class="fssh-close" id="fssh-close" aria-label="閉じる">×</button>
  <div class="fssh-drawer-header">MENU</div>
  <nav>
    <a href="index2.html" data-i18n="menu_home">ホーム</a>
    <a href="queue.html" data-i18n="menu_matching">マッチング</a>
    <a href="profile.html" id="fssh-nav-profile" style="display:none" data-i18n="menu_myprofile">マイプロフィール</a>
    <a href="ranking.html" data-i18n="menu_ranking">ランキング</a>
    <a href="howto.html" data-i18n="menu_howto">How to</a>
    <a href="faq.html" data-i18n="menu_faq">Q&amp;A</a>
    <a href="terms.html" data-i18n="menu_terms">利用規約</a>
    <div class="fssh-sub">
      <div class="fssh-sub-label" data-i18n="menu_sistertools_label">姉妹ツール</div>
      <a href="https://jiz41.github.io/FSScreener/" target="_blank" rel="noopener">FSScreener</a>
      <a href="https://fssplicer.pages.dev/" target="_blank" rel="noopener">FSSplicer</a>
      <a href="https://jiz41.github.io/FSstriders/" target="_blank" rel="noopener">FSstriders</a>
    </div>
  </nav>
</div>
<h1 data-i18n="h1_profile">騎手プロフィール</h1>

<div id="panel">
  <div id="header-row">
    <div class="jockey-icon" id="p-icon"></div>
    <div id="p-name" style="font-size: 18px;" data-i18n="loading">読み込み中...</div>
  </div>
  <div class="row"><span class="label" data-i18n="label_rating">レート</span><span id="p-rating">-</span></div>
  <div class="row"><span class="label" data-i18n="label_record">戦績</span><span id="p-record">-</span></div>
  <div class="row"><span class="label">X</span><span id="p-xlink">-</span></div>
</div>

<div id="panel" style="margin-top:16px;">
  <div id="distance-title" style="font-size:14px; color:#9aa4b2; margin-bottom:8px;"></div>
  <table id="distance-table" style="border-collapse:collapse; width:100%; margin-bottom:20px;"></table>
  <div id="venue-title" style="font-size:14px; color:#9aa4b2; margin-bottom:8px;"></div>
  <table id="venue-table" style="border-collapse:collapse; width:100%;"></table>
</div>

<div id="profile-edit-panel" style="display:none">
  <h2 data-i18n="h2_profile_edit">プロフィール編集</h2>
  <div class="row">
    <input type="text" id="edit-display-tag" data-i18n-placeholder="ph_jockey_name" placeholder="ジョッキーネーム" maxlength="40">
    <button type="button" id="btn-save-display-tag" data-i18n="btn_save">保存</button>
  </div>
  <div class="row">
    <input type="text" id="edit-x-link" placeholder="https://x.com/your_account">
    <button type="button" id="btn-save-x-link" data-i18n="btn_save">保存</button>
  </div>
  <div class="row">
    <div class="label" data-i18n="label_bg_color">背景色</div>
    <div class="icon-choices" id="choices-bg"></div>
  </div>
  <div class="row">
    <div class="label" data-i18n="label_border">枠</div>
    <div class="icon-choices" id="choices-border"></div>
  </div>
  <div class="row">
    <div class="label" data-i18n="label_crest">紋章</div>
    <div class="icon-choices" id="choices-crest"></div>
  </div>
  <div class="row"><span data-i18n="label_preview">プレビュー</span>: <span class="jockey-icon" id="icon-preview"></span></div>
  <div class="row"><button type="button" id="btn-save-icon" data-i18n="btn_save_icon">アイコンを保存</button></div>
</div>

<script>
const I18N = {
  ja: {
    h1_profile: "騎手プロフィール",
    loading: "読み込み中...",
    label_rating: "レート",
    label_record: "戦績",
    id_missing: "IDが指定されていません",
    not_found: "騎手が見つかりません",
    not_set: "未設定",
    wins_suffix: "勝",
    losses_suffix: "敗",
    races_suffix: "戦",
    distance_title: "距離別成績",
    venue_title: "場別成績",
    h2_profile_edit: "プロフィール編集",
    ph_jockey_name: "ジョッキーネーム",
    btn_save: "保存",
    label_bg_color: "背景色",
    label_border: "枠",
    label_crest: "紋章",
    label_preview: "プレビュー",
    btn_save_icon: "アイコンを保存",
    menu_home: "ホーム",
    menu_matching: "マッチング",
    menu_myprofile: "マイプロフィール",
    menu_ranking: "ランキング",
    menu_terms: "利用規約",
    menu_faq: "Q&A",
    menu_howto: "How to",
    menu_sistertools_label: "姉妹ツール"
  },
  en: {
    h1_profile: "Jockey Profile",
    loading: "Loading...",
    label_rating: "Rating",
    label_record: "Record",
    id_missing: "No ID specified",
    not_found: "Jockey not found",
    not_set: "Not set",
    wins_suffix: "W",
    losses_suffix: "L",
    races_suffix: " Races",
    distance_title: "Record by Distance",
    venue_title: "Record by Venue",
    h2_profile_edit: "Edit Profile",
    ph_jockey_name: "Jockey Name",
    btn_save: "Save",
    label_bg_color: "Background",
    label_border: "Frame",
    label_crest: "Crest",
    label_preview: "Preview",
    btn_save_icon: "Save Icon",
    menu_home: "Home",
    menu_matching: "Matching",
    menu_myprofile: "My Profile",
    menu_ranking: "Ranking",
    menu_terms: "Terms of Service",
    menu_faq: "Q&A",
    menu_howto: "How to",
    menu_sistertools_label: "Sister Tools"
  }
};

const DISTANCE_CATEGORY_LABEL = {
  ja: { "短距離": "短距離", "マイル": "マイル", "中距離": "中距離", "クラシック": "クラシック", "長距離": "長距離", "超長距離": "超長距離" },
  en: { "短距離": "Sprint", "マイル": "Mile", "中距離": "Intermediate", "クラシック": "Classic", "長距離": "Long", "超長距離": "Extended" }
};

const VENUE_LABEL = {
  ja: { "東京": "東京", "中山": "中山", "阪神": "阪神", "京都": "京都", "中京": "中京" },
  en: { "東京": "Tokyo", "中山": "Nakayama", "阪神": "Hanshin", "京都": "Kyoto", "中京": "Chukyo" }
};

function currentLang() {
  return document.documentElement.getAttribute("data-lang") || "ja";
}

function t(key) {
  const lang = currentLang();
  return (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key] : (I18N.ja[key] || "");
}

function applyLanguage(lang) {
  document.documentElement.setAttribute("data-lang", lang);
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  try { localStorage.setItem('fssh_lang', lang); } catch (e) {}
}

function setupLangToggle() {
  const root = document.documentElement;
  const btn = document.getElementById("lang-toggle");

  function updateLabel() {
    const lang = root.getAttribute("data-lang") || "ja";
    btn.textContent = lang === "ja" ? "ENG" : "JPN";
  }

  btn.addEventListener("click", () => {
    const current = root.getAttribute("data-lang") || "ja";
    const next = current === "ja" ? "en" : "ja";
    applyLanguage(next);
    updateLabel();
    load();
  });

  updateLabel();
}

(function () {
  try {
    if (localStorage.getItem('fssh_lang') === 'en') {
      applyLanguage('en');
    }
  } catch (e) {}
})();

setupLangToggle();

const ICON_BG = { red: "#cc3344", blue: "#3366cc", green: "#33aa55", purple: "#8855cc", orange: "#ff8833", yellow: "#ddbb22", black: "#222222", white: "#eeeeee" };
const ICON_BORDER_STYLE = { solid: "3px solid #fff", double: "4px double #fff", dashed: "3px dashed #fff", thick: "6px solid #fff" };
const ICON_CREST = ["🐎", "🏆", "⭐", "👑", "⚡", "🛡️", "🦅", "🔥"];
const ICON_BG_KEYS = Object.keys(ICON_BG);
const ICON_BORDER_KEYS = Object.keys(ICON_BORDER_STYLE);

function renderIcon(el, bg, border, crest) {
  el.style.background = ICON_BG[bg] || "#444";
  el.style.border = ICON_BORDER_STYLE[border] || "3px solid #fff";
  el.textContent = crest || "";
}

const $ = (id) => document.getElementById(id);

let selectedBg = "blue";
let selectedBorder = "solid";
let selectedCrest = "🐎";
let isSelfProfile = false;

function buildChoices(containerId, values, selectedGetter, onSelect) {
  const container = $(containerId);
  container.innerHTML = "";
  values.forEach((v) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "icon-choice" + (selectedGetter() === v ? " selected" : "");
    btn.textContent = v;
    btn.addEventListener("click", function () {
      onSelect(v);
      Array.from(container.children).forEach((c) => c.classList.remove("selected"));
      btn.classList.add("selected");
      renderIcon($("icon-preview"), selectedBg, selectedBorder, selectedCrest);
    });
    container.appendChild(btn);
  });
}

function initIconChoices() {
  buildChoices("choices-bg", ICON_BG_KEYS, () => selectedBg, (v) => { selectedBg = v; });
  buildChoices("choices-border", ICON_BORDER_KEYS, () => selectedBorder, (v) => { selectedBorder = v; });
  buildChoices("choices-crest", ICON_CREST, () => selectedCrest, (v) => { selectedCrest = v; });
  renderIcon($("icon-preview"), selectedBg, selectedBorder, selectedCrest);
}

async function checkSelfAndShowEditPanel(profileId) {
  $("profile-edit-panel").style.display = "none";
  if (!profileId) return;
  let body = null;
  try {
    const res = await fetch('/api/queue/status', { credentials: 'same-origin' });
    if (res.status === 401) return;
    body = await res.json();
  } catch (e) {
    return;
  }
  if (!body || !body.account || !body.account.discord_id) return;
  if (String(body.account.discord_id) !== String(profileId)) return;
  isSelfProfile = true;
  $("profile-edit-panel").style.display = "block";
  const profRes = await fetch("/api/account/profile?id=" + encodeURIComponent(profileId));
  if (profRes.status !== 200) return;
  const profBody = await profRes.json();
  if (profBody.display_tag) $("edit-display-tag").value = profBody.display_tag;
  if (profBody.x_link) $("edit-x-link").value = profBody.x_link;
  if (profBody.icon_bg) selectedBg = profBody.icon_bg;
  if (profBody.icon_border) selectedBorder = profBody.icon_border;
  if (profBody.icon_crest) selectedCrest = profBody.icon_crest;
  initIconChoices();
}

async function apiPost(path, data) {
  const res = await fetch(path, {
    method: "POST",
    credentials: "same-origin",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(data),
  });
  let body = null;
  try { body = await res.json(); } catch (e) { body = null; }
  return { status: res.status, body: body };
}

$("btn-save-display-tag").addEventListener("click", async function () {
  const name = $("edit-display-tag").value.trim();
  if (!name) return;
  await apiPost("/api/account/profile", { display_tag: name });
  load();
});

$("btn-save-x-link").addEventListener("click", async function () {
  const value = $("edit-x-link").value.trim();
  await apiPost("/api/account/profile", { x_link: value });
  load();
});

$("btn-save-icon").addEventListener("click", async function () {
  const res = await apiPost("/api/account/profile", { icon_bg: selectedBg, icon_border: selectedBorder, icon_crest: selectedCrest });
  if (res.status === 200) {
    load();
  }
});

async function load() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  if (!id) {
    $("p-name").textContent = t("id_missing");
    return;
  }
  const res = await fetch("/api/account/profile?id=" + encodeURIComponent(id));
  if (res.status === 404) {
    $("p-name").textContent = t("not_found");
    return;
  }
  const body = await res.json();
  $("p-name").textContent = body.display_tag;
  $("p-rating").textContent = body.rating;
  const total = body.total !== undefined ? body.total : (body.wins + body.losses);
  $("p-record").textContent = total + t("races_suffix") + body.wins + t("wins_suffix") + body.losses + t("losses_suffix");
  renderIcon($("p-icon"), body.icon_bg, body.icon_border, body.icon_crest);
  renderDistanceTable(body.distance_stats || []);
  renderVenueTable(body.venue_stats || []);
  if (body.x_link) {
    const a = document.createElement("a");
    a.href = body.x_link;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = body.x_link;
    $("p-xlink").innerHTML = "";
    $("p-xlink").appendChild(a);
  } else {
    $("p-xlink").textContent = t("not_set");
  }
  checkSelfAndShowEditPanel(id);
}

function renderDistanceTable(stats) {
  const lang = currentLang();
  $("distance-title").textContent = t("distance_title");
  const table = $("distance-table");
  table.innerHTML = "";
  stats.forEach((s) => {
    const label = (DISTANCE_CATEGORY_LABEL[lang] && DISTANCE_CATEGORY_LABEL[lang][s.category]) || s.category;
    const tr = document.createElement("tr");
    const tdName = document.createElement("td");
    tdName.style.cssText = "padding:4px 8px; border-bottom:1px solid #333;";
    tdName.textContent = label;
    const tdRecord = document.createElement("td");
    tdRecord.style.cssText = "padding:4px 8px; border-bottom:1px solid #333; text-align:right;";
    tdRecord.textContent = s.wins + t("wins_suffix") + s.losses + t("losses_suffix");
    tr.appendChild(tdName);
    tr.appendChild(tdRecord);
    table.appendChild(tr);
  });
}

function renderVenueTable(stats) {
  const lang = currentLang();
  $("venue-title").textContent = t("venue_title");
  const table = $("venue-table");
  table.innerHTML = "";
  stats.forEach((s) => {
    const label = (VENUE_LABEL[lang] && VENUE_LABEL[lang][s.venue]) || s.venue;
    const tr = document.createElement("tr");
    const tdName = document.createElement("td");
    tdName.style.cssText = "padding:4px 8px; border-bottom:1px solid #333;";
    tdName.textContent = label;
    const tdRecord = document.createElement("td");
    tdRecord.style.cssText = "padding:4px 8px; border-bottom:1px solid #333; text-align:right;";
    tdRecord.textContent = s.wins + t("wins_suffix") + s.losses + t("losses_suffix");
    tr.appendChild(tdName);
    tr.appendChild(tdRecord);
    table.appendChild(tr);
  });
}

load();
</script>
<script>
(function () {
  var toggle = document.getElementById('fssh-menu-toggle');
  var overlay = document.getElementById('fssh-overlay');
  var drawer = document.getElementById('fssh-drawer');
  var closeBtn = document.getElementById('fssh-close');
  function openMenu() { overlay.classList.add('open'); drawer.classList.add('open'); }
  function closeMenu() { overlay.classList.remove('open'); drawer.classList.remove('open'); }
  toggle.addEventListener('click', openMenu);
  overlay.addEventListener('click', closeMenu);
  closeBtn.addEventListener('click', closeMenu);

  fetch('/api/queue/status', { credentials: 'same-origin' }).then(function (res) {
    if (res.status === 401) return null;
    return res.json();
  }).then(function (body) {
    if (body && body.account && body.account.discord_id) {
      var el = document.getElementById('fssh-nav-profile');
      el.href = 'profile.html?id=' + encodeURIComponent(body.account.discord_id);
      el.style.display = 'block';
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
