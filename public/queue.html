<!DOCTYPE html>
<html lang="ja" data-lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSShowdown - マッチング（動作確認用）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #14161a; color: #e8e8e8; }
  h1 { font-size: 20px; }
  .lang-toggle { background: #33ff66; color: #14161a; border: none; border-radius: 4px; padding: 0.25rem 0.55rem; font-size: 0.75rem; cursor: pointer; margin-bottom: 12px; }
  h2 { font-size: 16px; margin-top: 24px; }
  button { font-size: 16px; padding: 10px 18px; margin: 6px 6px 6px 0; border: 0; border-radius: 6px; background: #3a6ea5; color: #fff; cursor: pointer; }
  button:disabled { background: #444; cursor: not-allowed; }
  input[type="text"] { font-size: 15px; padding: 8px 10px; border-radius: 6px; border: 1px solid #444; background: #0d0f12; color: #e8e8e8; min-width: 240px; }
  #panel { border: 1px solid #333; border-radius: 8px; padding: 16px; margin-top: 16px; max-width: 640px; }
  .row { margin: 6px 0; }
  .label { color: #9aa4b2; display: inline-block; min-width: 7em; }
  pre { background: #0d0f12; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  a { color: #7ab0ff; }
  #jockey-gate, #profile-panel { border: 1px solid #333; border-radius: 8px; padding: 16px; margin-top: 16px; max-width: 640px; }
  .icon-choices { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .icon-choice { padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #22262d; color: #e8e8e8; cursor: pointer; }
  .icon-choice.selected { outline: 2px solid #3a6ea5; }
  .jockey-icon { width: 56px; height: 56px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; vertical-align: middle; }
  #self-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
</style>
</head>
<body>
<button class="lang-toggle" id="lang-toggle" aria-label="言語切り替え">ENG</button>
<h1 data-i18n="h1_title">FSShowdown マッチング（段階1・動作確認用）</h1>

<div class="row">
  <a href="/auth/login"><button type="button" data-i18n="btn_discord_login">Discordでログイン</button></a>
</div>

<div id="jockey-gate" style="display:none">
  <div class="row" data-i18n="jockey_gate_msg">まずジョッキーネームを登録してください。</div>
  <div class="row">
    <input type="text" id="jockey-name-input" data-i18n-placeholder="ph_jockey_name" placeholder="ジョッキーネーム" maxlength="40">
    <button type="button" id="btn-register-jockey" data-i18n="btn_register">登録</button>
  </div>
</div>

<div id="main-ui" style="display:none">
  <div id="self-header">
    <div class="jockey-icon" id="self-icon"></div>
    <div id="self-name">-</div>
  </div>

  <div class="row">
    <button type="button" id="btn-join" data-i18n="btn_join">マッチング開始</button>
    <button type="button" id="btn-leave" data-i18n="btn_leave">キュー離脱</button>
    <button type="button" id="btn-reserve" style="display:none" data-i18n="btn_reserve">予約する</button>
    <button type="button" id="btn-win" style="display:none" data-i18n="btn_win">勝った</button>
    <button type="button" id="btn-loss" style="display:none" data-i18n="btn_loss">負けた</button>
  </div>

  <div id="panel">
    <div class="row"><span class="label" data-i18n="label_account">ログイン</span><span id="v-account" data-i18n="v_account_default">未確認</span></div>
    <div class="row"><span class="label" data-i18n="label_state">状態</span><span id="v-state">-</span></div>
    <div class="row"><span class="label" data-i18n="label_race">レース</span><span id="v-race">-</span></div>
    <div class="row"><span class="label" data-i18n="label_opponent">対戦相手</span><span id="v-opponent">-</span></div>
    <div class="row"><span class="label" data-i18n="label_host">ホスト</span><span id="v-role">-</span></div>
    <div class="row"><span class="label" data-i18n="label_remain">残り時間</span><span id="v-remain">-</span></div>
  </div>

  <div id="profile-panel">
    <h2 data-i18n="h2_profile_edit">プロフィール編集</h2>
    <div class="row">
      <input type="text" id="edit-display-tag" data-i18n-placeholder="ph_jockey_name" placeholder="ジョッキーネーム" maxlength="40">
      <button type="button" id="btn-save-display-tag" data-i18n="btn_save">保存</button>
    </div>
    <div class="row">
      <input type="text" id="edit-x-link" placeholder="https://x.com/your_account">
      <button type="button" id="btn-save-x-link" data-i18n="btn_save">保存</button>
    </div>
    <div class="row">
      <div class="label" data-i18n="label_bg_color">背景色</div>
      <div class="icon-choices" id="choices-bg"></div>
    </div>
    <div class="row">
      <div class="label" data-i18n="label_border">枠</div>
      <div class="icon-choices" id="choices-border"></div>
    </div>
    <div class="row">
      <div class="label" data-i18n="label_crest">紋章</div>
      <div class="icon-choices" id="choices-crest"></div>
    </div>
    <div class="row"><span data-i18n="label_preview">プレビュー</span>: <span class="jockey-icon" id="icon-preview"></span></div>
    <div class="row"><button type="button" id="btn-save-icon" data-i18n="btn_save_icon">アイコンを保存</button></div>
  </div>
</div>

<pre id="log"></pre>

<script>
const I18N = {
  ja: {
    h1_title: "FSShowdown マッチング（段階1・動作確認用）",
    btn_discord_login: "Discordでログイン",
    jockey_gate_msg: "まずジョッキーネームを登録してください。",
    ph_jockey_name: "ジョッキーネーム",
    btn_register: "登録",
    btn_join: "マッチング開始",
    btn_leave: "キュー離脱",
    btn_reserve: "予約する",
    btn_win: "勝った",
    btn_loss: "負けた",
    label_account: "ログイン",
    v_account_default: "未確認",
    label_state: "状態",
    label_race: "レース",
    label_opponent: "対戦相手",
    label_host: "ホスト",
    label_remain: "残り時間",
    h2_profile_edit: "プロフィール編集",
    btn_save: "保存",
    label_bg_color: "背景色",
    label_border: "枠",
    label_crest: "紋章",
    label_preview: "プレビュー",
    btn_save_icon: "アイコンを保存",
    not_logged_in: "未ログイン",
    host_you: "あなたがホスト",
    host_opponent: "相手がホスト（参加側）",
    no_contest: "不成立（15分超過）",
    result_fixed: "結果確定済み",
    not_reserved: "未予約",
    seconds_suffix: " 秒",
    expired: "期限切れ",
    result_confirmed_log: "結果確定",
    result_mismatch_log: "結果不一致、再送信してください",
    awaiting_opponent_log: "相手の報告待ち",
    rating_suffix: "（レート "
  },
  en: {
    h1_title: "FSShowdown Matchmaking (Phase 1 / Test Build)",
    btn_discord_login: "Log in with Discord",
    jockey_gate_msg: "Please register a Jockey Name first.",
    ph_jockey_name: "Jockey Name",
    btn_register: "Register",
    btn_join: "Start Matching",
    btn_leave: "Leave Queue",
    btn_reserve: "Reserve",
    btn_win: "Win",
    btn_loss: "Loss",
    label_account: "Login",
    v_account_default: "Unverified",
    label_state: "Status",
    label_race: "Race",
    label_opponent: "Opponent",
    label_host: "Host",
    label_remain: "Time Left",
    h2_profile_edit: "Edit Profile",
    btn_save: "Save",
    label_bg_color: "Background",
    label_border: "Frame",
    label_crest: "Crest",
    label_preview: "Preview",
    btn_save_icon: "Save Icon",
    not_logged_in: "Not logged in",
    host_you: "You are the host",
    host_opponent: "Opponent is host (joining)",
    no_contest: "No contest (15 min elapsed)",
    result_fixed: "Result finalized",
    not_reserved: "Not reserved",
    seconds_suffix: " sec",
    expired: "Expired",
    result_confirmed_log: "Result finalized",
    result_mismatch_log: "Result mismatch, please resend",
    awaiting_opponent_log: "Waiting for opponent's report",
    rating_suffix: " (Rating "
  }
};

function currentLang() {
  return document.documentElement.getAttribute("data-lang") || "ja";
}

function t(key) {
  const lang = currentLang();
  return (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key] : (I18N.ja[key] || "");
}

function applyLanguage(lang) {
  document.documentElement.setAttribute("data-lang", lang);
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.setAttribute("placeholder", t(el.getAttribute("data-i18n-placeholder")));
  });
}

function setupLangToggle() {
  const root = document.documentElement;
  const btn = document.getElementById("lang-toggle");

  function updateLabel() {
    const lang = root.getAttribute("data-lang") || "ja";
    btn.textContent = lang === "ja" ? "ENG" : "JPN";
  }

  btn.addEventListener("click", () => {
    const current = root.getAttribute("data-lang") || "ja";
    const next = current === "ja" ? "en" : "ja";
    applyLanguage(next);
    updateLabel();
  });

  updateLabel();
}

setupLangToggle();

const ICON_BG = { red: "#cc3344", blue: "#3366cc", green: "#33aa55", purple: "#8855cc", orange: "#ff8833", yellow: "#ddbb22", black: "#222222", white: "#eeeeee" };
const ICON_BORDER_STYLE = { solid: "3px solid #fff", double: "4px double #fff", dashed: "3px dashed #fff", thick: "6px solid #fff" };
const ICON_CREST = ["🐎", "🏆", "⭐", "👑", "⚡", "🛡️", "🦅", "🔥"];
const ICON_BG_KEYS = Object.keys(ICON_BG);
const ICON_BORDER_KEYS = Object.keys(ICON_BORDER_STYLE);

function renderIcon(el, bg, border, crest) {
  el.style.background = ICON_BG[bg] || "#444";
  el.style.border = ICON_BORDER_STYLE[border] || "3px solid #fff";
  el.textContent = crest || "";
}

let currentMatchId = null;
let currentExpiresAt = null;
let polling = null;
let selfAccount = null;
let selectedBg = "blue";
let selectedBorder = "solid";
let selectedCrest = "🐎";

const $ = (id) => document.getElementById(id);

function log(message, data) {
  const text = data === undefined ? message : message + " " + JSON.stringify(data);
  $("log").textContent = (new Date().toLocaleTimeString() + "  " + text + "\n" + $("log").textContent).slice(0, 4000);
}

async function api(path, options) {
  const res = await fetch(path, Object.assign({ credentials: "same-origin" }, options || {}));
  let body = null;
  try { body = await res.json(); } catch (e) { body = { error: "invalid_json" }; }
  return { status: res.status, body: body };
}

function buildChoices(containerId, values, selectedGetter, onSelect) {
  const container = $(containerId);
  container.innerHTML = "";
  values.forEach((v) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "icon-choice" + (selectedGetter() === v ? " selected" : "");
    btn.textContent = v;
    btn.addEventListener("click", function () {
      onSelect(v);
      Array.from(container.children).forEach((c) => c.classList.remove("selected"));
      btn.classList.add("selected");
      renderIcon($("icon-preview"), selectedBg, selectedBorder, selectedCrest);
    });
    container.appendChild(btn);
  });
}

function initIconChoices() {
  buildChoices("choices-bg", ICON_BG_KEYS, () => selectedBg, (v) => { selectedBg = v; });
  buildChoices("choices-border", ICON_BORDER_KEYS, () => selectedBorder, (v) => { selectedBorder = v; });
  buildChoices("choices-crest", ICON_CREST, () => selectedCrest, (v) => { selectedCrest = v; });
  renderIcon($("icon-preview"), selectedBg, selectedBorder, selectedCrest);
}

function render(body) {
  if (body.account) {
    selfAccount = body.account;
    $("v-account").textContent = body.account.display_tag + t("rating_suffix") + body.account.rating + "）";
  }
  $("v-state").textContent = body.status || "-";

  if (body.status === "matched" && body.match) {
    currentMatchId = body.match.match_id;
    currentExpiresAt = body.match.expires_at;
    $("v-race").textContent = body.match.race_name || "-";
    if (body.match.opponent_display_tag) {
      $("v-opponent").innerHTML = body.match.opponent_discord_id
        ? '<a href="/profile.html?id=' + encodeURIComponent(body.match.opponent_discord_id) + '" target="_blank" rel="noopener">' + body.match.opponent_display_tag + '</a>'
        : body.match.opponent_display_tag;
    } else {
      $("v-opponent").textContent = "-";
    }
    if (body.match.status === "reserved") {
      $("v-role").textContent = body.match.host_id === body.account.discord_id ? t("host_you") : t("host_opponent");
      $("btn-reserve").style.display = "none";
      $("btn-win").style.display = "inline-block";
      $("btn-loss").style.display = "inline-block";
    } else if (body.match.status === "no_contest") {
      $("v-role").textContent = t("no_contest");
      $("btn-reserve").style.display = "none";
      $("btn-win").style.display = "none";
      $("btn-loss").style.display = "none";
      stopPolling();
    } else if (body.match.status === "completed") {
      $("v-role").textContent = t("result_fixed");
      $("btn-reserve").style.display = "none";
      $("btn-win").style.display = "none";
      $("btn-loss").style.display = "none";
      stopPolling();
    } else {
      $("v-role").textContent = t("not_reserved");
      $("btn-reserve").style.display = "inline-block";
      $("btn-win").style.display = "none";
      $("btn-loss").style.display = "none";
    }
  } else {
    currentMatchId = null;
    currentExpiresAt = null;
    $("v-race").textContent = "-";
    $("v-opponent").textContent = "-";
    $("v-role").textContent = "-";
    $("v-remain").textContent = "-";
    $("btn-reserve").style.display = "none";
    $("btn-win").style.display = "none";
    $("btn-loss").style.display = "none";
  }
}

function tickRemain() {
  if (!currentExpiresAt) return;
  const left = currentExpiresAt - Math.floor(Date.now() / 1000);
  $("v-remain").textContent = left > 0 ? left + t("seconds_suffix") : t("expired");
}

function startPolling() {
  if (polling) return;
  polling = setInterval(refresh, 3000);
}

function stopPolling() {
  if (!polling) return;
  clearInterval(polling);
  polling = null;
}

function applyGate(account) {
  if (!account.display_tag) {
    $("jockey-gate").style.display = "block";
    $("main-ui").style.display = "none";
  } else {
    $("jockey-gate").style.display = "none";
    $("main-ui").style.display = "block";
    $("self-name").textContent = account.display_tag + t("rating_suffix") + account.rating + "）";
    $("edit-display-tag").value = account.display_tag;
  }
}

async function refresh() {
  const res = await api("/api/queue/status");
  if (res.status === 401) {
    $("v-account").textContent = t("not_logged_in");
    $("jockey-gate").style.display = "none";
    $("main-ui").style.display = "none";
    stopPolling();
    return;
  }
  if (res.body.account) {
    applyGate(res.body.account);
  }
  render(res.body);
}

async function loadProfile() {
  if (!selfAccount) return;
  const res = await api("/api/account/profile?id=" + encodeURIComponent(selfAccount.discord_id));
  if (res.status !== 200) return;
  if (res.body.icon_bg) selectedBg = res.body.icon_bg;
  if (res.body.icon_border) selectedBorder = res.body.icon_border;
  if (res.body.icon_crest) selectedCrest = res.body.icon_crest;
  initIconChoices();
  renderIcon($("self-icon"), selectedBg, selectedBorder, selectedCrest);
  if (res.body.x_link) $("edit-x-link").value = res.body.x_link;
}

$("btn-register-jockey").addEventListener("click", async function () {
  const name = $("jockey-name-input").value.trim();
  if (!name) return;
  const res = await api("/api/account/profile", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ display_tag: name }),
  });
  log("register jockey", res.body);
  if (res.status === 200) {
    refresh().then(loadProfile);
  }
});

$("btn-save-display-tag").addEventListener("click", async function () {
  const name = $("edit-display-tag").value.trim();
  if (!name) return;
  const res = await api("/api/account/profile", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ display_tag: name }),
  });
  log("save display_tag", res.body);
  refresh();
});

$("btn-save-x-link").addEventListener("click", async function () {
  const value = $("edit-x-link").value.trim();
  const res = await api("/api/account/profile", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ x_link: value }),
  });
  log("save x_link", res.body);
});

$("btn-save-icon").addEventListener("click", async function () {
  const res = await api("/api/account/profile", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ icon_bg: selectedBg, icon_border: selectedBorder, icon_crest: selectedCrest }),
  });
  log("save icon", res.body);
  if (res.status === 200) {
    renderIcon($("self-icon"), selectedBg, selectedBorder, selectedCrest);
  }
});

$("btn-join").addEventListener("click", async function () {
  const res = await api("/api/queue/join", { method: "POST" });
  log("join", res.body);
  if (res.status === 401) { $("v-account").textContent = t("not_logged_in"); return; }
  render(Object.assign({ account: selfAccount }, res.body));
  startPolling();
  refresh();
});

$("btn-leave").addEventListener("click", async function () {
  const res = await api("/api/queue/leave", { method: "POST" });
  log("leave", res.body);
  stopPolling();
  refresh();
});

$("btn-reserve").addEventListener("click", async function () {
  if (!currentMatchId) return;
  const res = await api("/api/match/" + encodeURIComponent(currentMatchId) + "/reserve", { method: "POST" });
  log("reserve", res.body);
  refresh();
});

async function sendReport(result) {
  if (!currentMatchId) return;
  const res = await api("/api/match/" + encodeURIComponent(currentMatchId) + "/report", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ result: result }),
  });
  log("report:" + result, res.body);
  if (res.body && res.body.status === "completed") {
    log(t("result_confirmed_log"), {
      result: res.body.result,
      rating_delta: res.body.rating_delta,
      new_rating: res.body.new_rating,
    });
  } else if (res.body && res.body.status === "mismatch") {
    log(t("result_mismatch_log"), res.body);
  } else if (res.body && res.body.status === "awaiting_opponent") {
    log(t("awaiting_opponent_log"), res.body);
  }
  refresh();
}

$("btn-win").addEventListener("click", function () { sendReport("win"); });
$("btn-loss").addEventListener("click", function () { sendReport("loss"); });

initIconChoices();
setInterval(tickRemain, 1000);
refresh().then(loadProfile);
startPolling();
</script>
</body>
</html>
