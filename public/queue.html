<style>
  :root {
    --bg: #0a0e0a;
    --bg2: #0d1410;
    --green: #33ff66;
    --green-dim: #1a8a3a;
    --orange: #ff8833;
    --text: #d8ffe0;
    --text-dim: #7fa88f;
    --mono: 'IBM Plex Mono', 'Courier New', 'Consolas', 'SF Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, input, select, textarea { font: inherit; }
  body { font-family: var(--mono); margin: 0; padding: 80px 24px 24px; background: var(--bg); color: var(--text); }
  h1 { font-size: 20px; }
  .lang-toggle { position: static; background: var(--green); color: var(--bg); border: none; border-radius: 4px; padding: 0.25rem 0.55rem; font-size: 0.75rem; font-family: var(--mono); cursor: pointer; line-height: 1; margin: 0; }
  h2 { font-size: 16px; margin-top: 24px; }
  button:not(.fssh-close):not(.fssh-menu-btn):not(.lang-toggle) { font-size: 16px; font-family: var(--mono); padding: 10px 18px; margin: 6px 6px 6px 0; border: 0; border-radius: 6px; background: var(--green); color: var(--bg); cursor: pointer; }
  button:disabled { background: var(--text-dim); cursor: not-allowed; }
  input[type="text"] { font-size: 15px; font-family: var(--mono); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--green-dim); background: var(--bg2); color: var(--text); min-width: 240px; }
  #panel { border: 1px solid var(--green-dim); border-radius: 8px; padding: 16px; margin-top: 16px; max-width: 640px; }
  .row { margin: 6px 0; }
  .label { color: var(--text-dim); display: inline-block; min-width: 7em; }
  pre { background: var(--bg2); color: var(--text); padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  a { color: var(--green); }
  #jockey-gate { border: 1px solid var(--green-dim); border-radius: 8px; padding: 16px; margin-top: 16px; max-width: 640px; }
  .icon-choices { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .icon-choice { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--green-dim); background: var(--bg2); color: var(--text); cursor: pointer; }
  .icon-choice.selected { outline: 2px solid var(--green); }
  .jockey-icon { width: 56px; height: 56px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; vertical-align: middle; }
  #self-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }

  /* ===== FSSH COMMON MENU ===== */
  .fssh-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    z-index: 1000;
    background: #0a0e0a;
    border-bottom: 1px solid #1a8a3a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }
  .fssh-header-logo {
    height: 32px;
    width: auto;
  }
  .fssh-menu-btn {
    position: static;
    width: 40px;
    height: 40px;
    background: #0a0e0a;
    border: 1px solid #33ff66;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
  }
  .fssh-menu-btn span {
    display: block;
    width: 20px;
    height: 2px;
    background: #33ff66;
  }
  .fssh-overlay {
    position: fixed;
    top: 56px;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1001;
    display: none;
  }
  .fssh-overlay.open { display: block; }
  .fssh-drawer {
    position: fixed;
    top: 56px;
    left: 0;
    right: 0;
    width: auto;
    max-height: 0;
    background: #0a0e0a;
    border-bottom: 1px solid #1a8a3a;
    z-index: 1002;
    transition: max-height 0.25s ease;
    font-family: 'IBM Plex Mono', 'Courier New', 'Consolas', 'SF Mono', monospace;
    overflow-y: auto;
  }
  .fssh-drawer.open { max-height: 600px; }
  .fssh-drawer-header {
    padding: 16px;
    color: #33ff66;
    font-weight: 700;
    border-bottom: 1px solid #1a8a3a;
    line-height: 1.4;
  }
  .fssh-drawer nav { padding: 8px 0; }
  .fssh-drawer a {
    display: block;
    padding: 12px 16px;
    color: #d8ffe0;
    text-decoration: none;
    font-size: 0.9rem;
    border-bottom: 1px solid rgba(26,138,58,0.3);
  }
  .fssh-drawer a:hover {
    background: rgba(51,255,102,0.1);
    color: #33ff66;
  }
  .fssh-drawer .fssh-sub-label {
    padding: 12px 16px 4px;
    color: #7fa88f;
    font-size: 0.78rem;
  }
  .fssh-drawer .fssh-sub a {
    padding-left: 32px;
    font-size: 0.82rem;
  }
  .fssh-drawer .fssh-sub-link { display: flex; flex-direction: column; padding-left: 32px; }
  .fssh-drawer .fssh-sub-name { font-size: 0.82rem; }
  .fssh-drawer .fssh-sub-caption { font-size: 0.7rem; color: #7fa88f; white-space: normal; line-height: 1.4; }
  .fssh-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: #33ff66;
    font-size: 1.2rem;
    cursor: pointer;
    line-height: 1;
  }
  .fssh-header-right { display: flex; align-items: center; gap: 8px; }
  .fssh-discord-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--bg, #0a0e0a); border: 1px solid var(--green, #33ff66); border-radius: 6px; text-decoration: none; font-size: 1rem; }
</style>

<script>
const I18N = {

    menu_matching: "マッチング",
    menu_myprofile: "マイプロフィール",
    menu_ranking: "ランキング",
    menu_terms: "利用規約",
    menu_faq: "Q&A",
    menu_howto: "使い方",
    menu_sistertools_label: "LINK",
    link_desc_fssc: "条件検索でフルストに登場する史実馬の中から理想の1頭を探せる",
    link_desc_fssp: "自分だけの馬データ作りをサポートするツール",
    link_desc_fsst: "フルスト勢向け自己紹介カードジェネレーター"
  },
  en: {
    h1_title: "FSShowdown Matchmaking (Phase 1 / Test Build)",
    btn_discord_login: "Log in with Discord",
    jockey_gate_msg: "Please register a Jockey Name first.",
    ph_jockey_name: "Jockey Name",
    btn_register: "Register",
    btn_join: "Start Matching",
    btn_leave: "Leave Queue",
    btn_reserve: "Reserve",
    btn_win: "Win",
    btn_loss: "Loss",
    label_account: "Login",
    v_account_default: "Unverified",
    label_state: "Status",
    label_race: "Race",
    label_opponent: "Opponent",
    label_host: "Host",
    label_remain: "Time Left",
    not_logged_in: "Not logged in",
    host_you: "You are the host",
    host_opponent: "Opponent is host (joining)",
    no_contest: "No contest (15 min elapsed)",
    result_fixed: "Result finalized",
    not_reserved: "Not reserved",
    seconds_suffix: " sec",
    expired: "Expired",
    result_confirmed_log: "Result finalized",
    result_mismatch_log: "Result mismatch, please resend",
    awaiting_opponent_log: "Waiting for opponent's report",
    rating_suffix: " (Rating ",
    menu_home: "Home",
    menu_matching: "Matching",
    menu_myprofile: "My Profile",
    menu_ranking: "Ranking",
    menu_terms: "Terms of Service",
    menu_faq: "Q&A",
    menu_howto: "How to",
    menu_sistertools_label: "Links",
    link_desc_fssc: "Find your ideal historical racehorse from FULL STRIDE with detailed search filters",
    link_desc_fssp: "A tool that helps you create your own custom horse data",
    link_desc_fsst: "Player self-introduction card generator for the Full Stride community"
  }
};

function currentLang() {
  return document.documentElement.getAttribute("data-lang") || "ja";
}

function t(key) {
  const lang = currentLang();
  return (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key] : (I18N.ja[key] || "");
}

function applyLanguage(lang) {
  document.documentElement.setAttribute("data-lang", lang);
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.setAttribute("placeholder", t(el.getAttribute("data-i18n-placeholder")));
  });
  try { localStorage.setItem('fssh_lang', lang); } catch (e) {}
}

function setupLangToggle() {
  const root = document.documentElement;
  const btn = document.getElementById("lang-toggle");

  function updateLabel() {
    const lang = root.getAttribute("data-lang") || "ja";
    btn.textContent = lang === "ja" ? "ENG" : "JPN";
  }

  btn.addEventListener("click", () => {
    const current = root.getAttribute("data-lang") || "ja";
    const next = current === "ja" ? "en" : "ja";
    applyLanguage(next);
    updateLabel();
  });

  updateLabel();
}

(function () {
  try {
    if (localStorage.getItem('fssh_lang') === 'en') {
      applyLanguage('en');
    }
  } catch (e) {}
})();

setupLangToggle();

let currentMatchId = null;
let currentExpiresAt = null;
let polling = null;
let selfAccount = null;

const $ = (id) => document.getElementById(id);

function log(message, data) {
  const text = data === undefined ? message : message + " " + JSON.stringify(data);
  $("log").textContent = (new Date().toLocaleTimeString() + "  " + text + "\n" + $("log").textContent).slice(0, 4000);
}

async function api(path, options) {
  const res = await fetch(path, Object.assign({ credentials: "same-origin" }, options || {}));
  let body = null;
  try { body = await res.json(); } catch (e) { body = { error: "invalid_json" }; }
  return { status: res.status, body: body };
}

function render(body) {
  if (body.account) {
    selfAccount = body.account;
    $("v-account").textContent = body.account.display_tag + t("rating_suffix") + body.account.rating + "）";
  }
  $("v-state").textContent = body.status || "-";

  if (body.status === "matched" && body.match) {
    currentMatchId = body.match.match_id;
    currentExpiresAt = body.match.expires_at;
    $("v-race").textContent = body.match.race_name || "-";
    if (body.match.opponent_display_tag) {
      $("v-opponent").innerHTML = body.match.opponent_discord_id
        ? '<a href="/profile.html?id=' + encodeURIComponent(body.match.opponent_discord_id) + '" target="_blank" rel="noopener">' + body.match.opponent_display_tag + '</a>'
        : body.match.opponent_display_tag;
    } else {
      $("v-opponent").textContent = "-";
    }
    if (body.match.status === "reserved") {
      $("v-role").textContent = body.match.host_id === body.account.discord_id ? t("host_you") : t("host_opponent");
      $("btn-reserve").style.display = "none";
      $("btn-win").style.display = "inline-block";
      $("btn-loss").style.display = "inline-block";
    } else if (body.match.status === "no_contest") {
      $("v-role").textContent = t("no_contest");
      $("btn-reserve").style.display = "none";
      $("btn-win").style.display = "none";
      $("btn-loss").style.display = "none";
      stopPolling();
    } else if (body.match.status === "completed") {
      $("v-role").textContent = t("result_fixed");
      $("btn-reserve").style.display = "none";
      $("btn-win").style.display = "none";
      $("btn-loss").style.display = "none";
      stopPolling();
    } else {
      $("v-role").textContent = t("not_reserved");
      $("btn-reserve").style.display = "inline-block";
      $("btn-win").style.display = "none";
      $("btn-loss").style.display = "none";
    }
  } else {
    currentMatchId = null;
    currentExpiresAt = null;
    $("v-race").textContent = "-";
    $("v-opponent").textContent = "-";
    $("v-role").textContent = "-";
    $("v-remain").textContent = "-";
    $("btn-reserve").style.display = "none";
    $("btn-win").style.display = "none";
    $("btn-loss").style.display = "none";
  }
}

function tickRemain() {
  if (!currentExpiresAt) return;
  const left = currentExpiresAt - Math.floor(Date.now() / 1000);
  $("v-remain").textContent = left > 0 ? left + t("seconds_suffix") : t("expired");
}

function startPolling() {
  if (polling) return;
  polling = setInterval(refresh, 3000);
}

function stopPolling() {
  if (!polling) return;
  clearInterval(polling);
  polling = null;
}

function applyGate(account) {
  if (!account.display_tag) {
    $("jockey-gate").style.display = "block";
    $("main-ui").style.display = "none";
  } else {
    $("jockey-gate").style.display = "none";
    $("main-ui").style.display = "block";
    $("self-name").textContent = account.display_tag + t("rating_suffix") + account.rating + "）";
  }
}

async function refresh() {
  const res = await api("/api/queue/status");
  if (res.status === 401) {
    $("v-account").textContent = t("not_logged_in");
    $("jockey-gate").style.display = "none";
    $("main-ui").style.display = "none";
    stopPolling();
    return;
  }
  if (res.body.account) {
    applyGate(res.body.account);
  }
  render(res.body);
}

$("btn-register-jockey").addEventListener("click", async function () {
  const name = $("jockey-name-input").value.trim();
  if (!name) return;
  const res = await api("/api/account/profile", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ display_tag: name }),
  });
  log("register jockey", res.body);
  if (res.status === 200) {
    refresh();
  }
});

$("btn-join").addEventListener("click", async function () {
  const res = await api("/api/queue/join", { method: "POST" });
  log("join", res.body);
  if (res.status === 401) { $("v-account").textContent = t("not_logged_in"); return; }
  render(Object.assign({ account: selfAccount }, res.body));
  startPolling();
  refresh();
});

$("btn-leave").addEventListener("click", async function () {
  const res = await api("/api/queue/leave", { method: "POST" });
  log("leave", res.body);
  stopPolling();
  refresh();
});

$("btn-reserve").addEventListener("click", async function () {
  if (!currentMatchId) return;
  const res = await api("/api/match/" + encodeURIComponent(currentMatchId) + "/reserve", { method: "POST" });
  log("reserve", res.body);
  refresh();
});

async function sendReport(result) {
  if (!currentMatchId) return;
  const res = await api("/api/match/" + encodeURIComponent(currentMatchId) + "/report", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ result: result }),
  });
  log("report:" + result, res.body);
  if (res.body && res.body.status === "completed") {
    log(t("result_confirmed_log"), {
      result: res.body.result,
      rating_delta: res.body.rating_delta,
      new_rating: res.body.new_rating,
    });
  } else if (res.body && res.body.status === "mismatch") {
    log(t("result_mismatch_log"), res.body);
  } else if (res.body && res.body.status === "awaiting_opponent") {
    log(t("awaiting_opponent_log"), res.body);
  }
  refresh();
}

$("btn-win").addEventListener("click", function () { sendReport("win"); });
$("btn-loss").addEventListener("click", function () { sendReport("loss"); });

setInterval(tickRemain, 1000);
refresh();
startPolling();
</script>
<script>
(function () {
  var toggle = document.getElementById('fssh-menu-toggle');
  var overlay = document.getElementById('fssh-overlay');
  var drawer = document.getElementById('fssh-drawer');
  var closeBtn = document.getElementById('fssh-close');
  function openMenu() { overlay.classList.add('open'); drawer.classList.add('open'); }
  function closeMenu() { overlay.classList.remove('open'); drawer.classList.remove('open'); }
  toggle.addEventListener('click', openMenu);
  overlay.addEventListener('click', closeMenu);
  closeBtn.addEventListener('click', closeMenu);

  fetch('/api/queue/status', { credentials: 'same-origin' }).then(function (res) {
    if (res.status === 401) return null;
    return res.json();
  }).then(function (body) {
    if (body && body.account && body.account.discord_id) {
      var el = document.getElementById('fssh-nav-profile');
      el.href = 'profile.html?id=' + encodeURIComponent(body.account.discord_id);
      el.style.display = 'block';
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
