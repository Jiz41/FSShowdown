const I18N = {
  ja: {
    menu_home: "ホーム",
    menu_matching: "マッチング",
    menu_myprofile: "マイプロフィール",
    menu_ranking: "ランキング",
    menu_terms: "利用規約",
    menu_regulation: "レギュレーション<span class=\"fssh-menu-sub\">シーズン<span class=\"fssh-menu-sub-num\">0</span>概要</span>",
    menu_faq: "Q&A",
    menu_howto: "使い方",
    menu_sistertools_label: "LINK",
    link_desc_fssc: "条件検索でフルストに登場する史実馬の中から理想の1頭を探せる",
    link_desc_fssp: "自分だけの馬データ作りをサポートするツール",

    h1_ranking: "ランキング",
    ranking_placeholder: "準備中",
  
    footer_unofficial: "本ツールはファンによる非公式マッチングツールです。",
    footer_trademark_pre: "『FULL STRIDE』の名称は、",
    footer_trademark_post: "の商標または登録商標です。",
  },
  en: {
    menu_home: "Home",
    menu_matching: "Matching",
    menu_myprofile: "My Profile",
    menu_ranking: "Ranking",
    menu_terms: "Terms of Service",
    menu_regulation: "Regulation<span class=\"fssh-menu-sub\">Season <span class=\"fssh-menu-sub-num\">0</span> Overview</span>",
    menu_faq: "Q&A",
    menu_howto: "How to",
    menu_sistertools_label: "Links",
    link_desc_fssc: "Find your ideal historical racehorse from FULL STRIDE with detailed search filters",
    link_desc_fssp: "A tool that helps you create your own custom horse data",
    link_desc_fsst: "Player self-introduction card generator for the Full Stride community",
    h1_ranking: "Ranking",
    ranking_placeholder: "Coming soon",
  
    footer_unofficial: "This is an unofficial fan-made matchmaking tool.",
    footer_trademark_pre: "The name \"FULL STRIDE\" is a trademark or registered trademark of ",
    footer_trademark_post: ".",
  }
};

function currentLang() {
  return document.documentElement.getAttribute("data-lang") || "ja";
}

function t(key) {
  const lang = currentLang();
  return (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key] : (I18N.ja[key] || "");
}

function applyLanguage(lang) {
  document.documentElement.setAttribute("data-lang", lang);
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    el.innerHTML = t(el.getAttribute("data-i18n-html"));
  });
  try { localStorage.setItem('fssh_lang', lang); } catch (e) {}
}

function setupLangToggle() {
  const root = document.documentElement;
  const btn = document.getElementById("lang-toggle");

  function updateLabel() {
    const lang = root.getAttribute("data-lang") || "ja";
    btn.textContent = lang === "ja" ? "ENG" : "JPN";
  }

  btn.addEventListener("click", () => {
    const current = root.getAttribute("data-lang") || "ja";
    const next = current === "ja" ? "en" : "ja";
    applyLanguage(next);
    updateLabel();
  });

  updateLabel();
}

(function () {
  try {
    if (localStorage.getItem('fssh_lang') === 'en') {
      applyLanguage('en');
    }
  } catch (e) {}
})();

setupLangToggle();
</script>
<script>
(function () {
  var toggle = document.getElementById('fssh-menu-toggle');
  var overlay = document.getElementById('fssh-overlay');
  var drawer = document.getElementById('fssh-drawer');
  var closeBtn = document.getElementById('fssh-close');
  function openMenu() { overlay.classList.add('open'); drawer.classList.add('open'); }
  function closeMenu() { overlay.classList.remove('open'); drawer.classList.remove('open'); }
  toggle.addEventListener('click', openMenu);
  overlay.addEventListener('click', closeMenu);
  closeBtn.addEventListener('click', closeMenu);

  fetch('/api/queue/status', { credentials: 'same-origin' }).then(function (res) {
    if (res.status === 401) return null;
    return res.json();
  }).then(function (body) {
    if (body && body.account && body.account.discord_id) {
      var el = document.getElementById('fssh-nav-profile');
      el.href = 'profile.html?id=' + encodeURIComponent(body.account.discord_id);
      el.style.display = 'block';
    }
  }).catch(function () {});
})();
</script>
